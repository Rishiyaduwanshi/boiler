[tools]
go = "1.25.5"
lefthook = "latest"

[hooks]
postinstall = "lefthook install"

[env]
GO111MODULE = "on"
CGO_ENABLED = "0"

[tasks.build]
description = "Build the boiler binary"
run = "go run scripts/build.go build"


[tasks.dev]
description = "Build for development (without optimization)"
run = "go run scripts/build.go dev"

[tasks.bin]
description = "Install the binary to $GOPATH/bin"
run = "go install ."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Format and vet code"
depends = ["fmt", "vet"]

[tasks.deps]
description = "Download dependencies"
run = "go mod download && go mod tidy"


[tasks.update-deps]
description = "Update all dependencies"
run = "go get -u ./... && go mod tidy"

[tasks.release]
description = "Build optimized release binary with version"
run = "go run scripts/build.go release"

[tasks.test]
description = "Run all tests"
run = "go test ./internal/... -timeout 120s"

[tasks.setup]
description = "Set up the development environment"
run = """
go mod download
go mod tidy
lefthook install
"""

[tasks.check]
description = "Run all checks (fmt, vet, test)"
depends = ["fmt", "vet", "test"]

[tasks."winget:validate"]
description = "Validate local winget manifests"
run = "winget validate ./distributions/winget"

[tasks."winget:uninstall"]
description = "Uninstall Boiler if already installed via winget"
run = "winget uninstall --manifest ./distributions/winget"

[tasks."winget:install"]
description = "Install Boiler from local winget manifests"
run = "winget install --manifest ./distributions/winget"

[tasks."winget:smoke"]
description = "Smoke test installed Boiler binary"
run = "boiler version"

[tasks."winget:test"]
description = "Run full local winget test flow"
depends = [
  "winget:validate",
  "winget:uninstall",
  "winget:install",
  "winget:smoke",
]

[tasks."winget:clean"]
description = "Cleanup local winget installation"
depends = ["winget:uninstall"]
