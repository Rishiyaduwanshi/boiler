name: Build & Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'web/**'
      - '**.md'
      - '**.mdx'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'web/**'
      - '**.md'
      - '**.mdx'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Run tests
        run: go test -v ./...

      - name: Run vet
        run: go vet ./...

