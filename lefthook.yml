# Lefthook - Git hooks for Boiler
# https://github.com/evilmartians/lefthook
#
# First-time setup: mise install && lefthook install
# Skip hooks:  LEFTHOOK=0 git commit
# Skip one:    LEFTHOOK_EXCLUDE=test git push

pre-commit:
  parallel: false
  commands:
    vet:
      run: go vet ./...
    build:
      run: go build ./...
    gendocs:
      glob: internal/cli/*.go
      run: go run gendocs.go && git add web/src/content/docs/commands/*.md

pre-push:
  commands:
    test:
      run: go test ./internal/... -timeout=120s -v

commit-msg:
  commands:
    conventional:
      run: "grep -Eq '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\\(.+\\))?: .+' {1}"